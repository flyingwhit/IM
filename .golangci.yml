version: 3
# golangci-lint configuration for IM backend.
#
# Keep it minimal — this is a learning project, not a monorepo.
# We enable the high-signal linters and skip the pedantic ones.

run:
  timeout: 3m
  tests: true

linters:
  enable:
    - errcheck      # unchecked errors
    - gosimple      # simplify code
    - govet         # go vet
    - ineffassign   # ineffectual assignments
    - staticcheck   # static analysis (the big one)
    - unused        # unused code
    - gofmt         # format check
    - misspell      # spelling mistakes

linters-settings:
  misspell:
    locale: US

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files: os.Setenv, json.Unmarshal in tests don't need error checks.
    - path: _test\.go
      linters:
        - errcheck
    # Defer: Close/Rollback errors in defer are intentional (can't act on them).
    - linters:
        - errcheck
      text: "Error return value of `.*\\.(Close|Rollback|SetReadDeadline|SetWriteDeadline)` is not checked"
    # Defer: Close() via variable is fine.
    - linters:
        - errcheck
      source: "defer"
