# CI pipeline for IM Backend.
#
# Triggers on push/PR to main. Three jobs:
#   1. lint  — golangci-lint static analysis
#   2. test  — go test with race detector
#   3. build — go build to verify compilation
#
# Tests don't need PostgreSQL/Redis because unit tests use fakes.
#
# Uses go-version-file to read the exact Go version from go.mod,
# ensuring CI always matches the development environment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # v7 uses golangci-lint v2.x — compatible with our .golangci.yml v2 config.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test ./... -race -count=1 -shuffle=on

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build -o /dev/null ./cmd/server
