# Docker Compose for local observability stack.
#
# Starts Prometheus and Grafana alongside the existing infrastructure
# (PostgreSQL, Redis from the root docker-compose.yml).
#
# Usage:
#   docker compose -f docker-compose.yml -f configs/docker-compose.observability.yml up -d
#
# Access:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin/admin)

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: im-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access the IM server on host machine

  grafana:
    image: grafana/grafana:latest
    container_name: im-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
